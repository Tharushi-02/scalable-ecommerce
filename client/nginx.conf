# Docker's internal DNS. Re-check names every 5 seconds.
resolver 127.0.0.11 valid=5s ipv6=off;

# The API servers: every copy of the "server" service
upstream api {
    zone api 64k;           # shared memory so all Nginx workers see the same server list
    server server:4000 resolve;
    keepalive 32;
    keepalive_timeout 4s;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't reveal the Nginx version
    server_tokens off;

    # Reject big uploads at the door (same 1 MB limit as Express), as JSON
    client_max_body_size 1m;
    error_page 413 @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":"Request body too large"}';
    }

    # ---------- gzip ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Forward API calls to the server pool, reusing connections
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build files: cache for 1 year, never re-check
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell: always check for a newer version
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # React Router: unknown paths get index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}