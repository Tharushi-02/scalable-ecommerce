server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API isn't connected to this container yet (that's Day 21).
    # Same error shape as the real server: { "error": "text" }
    location /api/ {
        default_type application/json;
        return 503 '{"error":"API not connected yet"}';
    }

    # React Router: any unknown path (like /cart or /orders/5) gets index.html,
    # and React decides which page to show.
    location / {
        try_files $uri $uri/ /index.html;
    }
}