global:
  scrape_interval: 5s       # read every target every 5 seconds
  evaluation_interval: 15s

scrape_configs:
  # Every copy of the API server, found through Docker's DNS
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['server']
        type: A
        port: 4000
        refresh_interval: 10s

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']