name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Lint + build (fast, catches typos and syntax errors) ----------
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server - install
        working-directory: server
        run: npm ci

      - name: Server - lint
        working-directory: server
        run: npm run lint

      - name: Client - install
        working-directory: client
        run: npm ci

      - name: Client - lint
        working-directory: client
        run: npm run lint

      - name: Client - build
        working-directory: client
        run: npm run build

  # ---------- 2. Integration tests against the full Docker stack ----------
  integration:
    name: Integration tests (full stack)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Create .env with random secrets
        run: |
          {
            echo "POSTGRES_USER=ecom"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=ecommerce"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Start the stack
        run: docker compose up -d --build client

      - name: Wait until the API answers through Nginx
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/categories > /dev/null; then
              echo "Ready after ${i}x2 seconds"; exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready"; docker compose ps; exit 1

      - name: Seed the database
        working-directory: server
        run: |
          npm ci
          set -a; source ../.env; set +a
          export DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5433/${POSTGRES_DB}"
          npm run seed

      - name: API tests
        working-directory: server
        env:
          BASE_URL: http://localhost:8080
        run: npm run test:api

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Clean up
        if: always()
        run: docker compose down -v