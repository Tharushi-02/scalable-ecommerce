openapi: 3.0.3
info:
  title: Scalable E-Commerce API
  version: 1.0.0
  description: |
    Backend for a scalable e-commerce platform built with Node.js, Express 5 and PostgreSQL.

    Public endpoints need no login. Protected endpoints need an access token:
    log in, then click **Authorize** and paste the `accessToken`.
servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Register, log in, refresh tokens, log out
  - name: Products
    description: Browse the catalogue (public) and manage products (admin)
  - name: Categories
    description: Product categories (public)
  - name: Admin
    description: Admin-only tools
  - name: Cart
    description: The logged-in user's shopping cart
  - name: Orders
    description: Checkout and order history

paths:
  /health:
    get:
      tags: [Health]
      summary: Check that the API and database are running
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API and database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: connected }
                  uptime: { type: number, example: 12.5 }
        '500':
          description: The database is unreachable

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create a customer account
      operationId: register
      security: []
      description: >
        Creates a user with the customer role and logs them in straight away.
        The email is trimmed and lowercased. Unknown fields (such as role) are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100, example: Jane Perera }
                email: { type: string, format: email, maxLength: 255, example: jane@example.com }
                password: { type: string, minLength: 8, maxLength: 72, example: secret123 }
      responses:
        '201':
          description: Account created; returns the user and both tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: The email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Email is already registered }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      security: []
      description: >
        Returns a 15-minute access token and a 7-day single-use refresh token.
        A wrong password and an unknown email give the same 401 response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@example.com }
                password: { type: string, example: Password123! }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Invalid email or password }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Swap a refresh token for new tokens
      operationId: refreshTokens
      security: []
      description: >
        Each refresh token works only once (rotation). Reusing an old token is treated
        as theft, and every session for that user is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, example: 3a482afe042b6f79...e183e6f8df2f1f53 }
      responses:
        '200':
          description: New access token and new refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The refresh token is invalid, expired, or was already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  summary: Unknown or expired token
                  value: { error: Invalid or expired refresh token }
                reused:
                  summary: Token already used, so all sessions were revoked
                  value: { error: Refresh token reuse detected. Please log in again. }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out on this device
      operationId: logout
      security: []
      description: >
        Revokes the given refresh token. Always returns 204, even for unknown tokens.
        The access token keeps working until it expires (up to 15 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204':
          description: Logged out (no response body)
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the logged-in user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products (paginated, filterable, searchable)
      operationId: listProducts
      security: []
      description: >
        Public. Only active products are returned. All filters can be combined.
        Every sort order ends with the product id as a tie-breaker, so pages never overlap.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Items per page (maximum 100)
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: category
          in: query
          description: Category slug, for example books or home-kitchen
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          description: Must be greater than or equal to minPrice
          schema: { type: number, minimum: 0 }
        - name: inStock
          in: query
          description: true = stock above 0, false = out of stock only
          schema: { type: string, enum: ['true', 'false'] }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, name_asc]
            default: newest
        - name: q
          in: query
          description: Search text, matched against name and description (case-insensitive)
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: One page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }

    post:
      tags: [Products]
      summary: Create a product (admin)
      operationId: createProduct
      description: >
        The slug is generated from the name. If it is already taken,
        a short random suffix is added (for example ergonomic-chair-a3f9c1).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, categoryId]
              properties:
                name: { type: string, maxLength: 200, example: Ergonomic Office Chair }
                description: { type: string, maxLength: 5000, example: Adjustable lumbar support }
                price:
                  description: Number or string, not negative, at most 2 decimals
                  oneOf:
                    - type: number
                    - type: string
                  example: 249.99
                stock: { type: integer, minimum: 0, default: 0, example: 25 }
                categoryId: { type: integer, minimum: 1, example: 4 }
                imageUrl: { type: string, format: uri, example: 'https://picsum.photos/seed/chair/640/480' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ProductBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List all categories (A to Z)
      operationId: listCategories
      security: []
      description: Used by the shop's category filter. Pass a slug to GET /api/v1/products?category=...
      responses:
        '200':
          description: Every category
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '500':
          description: The database is unreachable

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags: [Products]
      summary: Get one product
      operationId: getProduct
      security: []
      description: Public. Inactive (soft-deleted) products return 404.
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Products]
      summary: Update a product (admin)
      operationId: updateProduct
      description: >
        Only the fields you send are changed. Send null to clear description or imageUrl.
        Send isActive true to restore a deleted product. The slug never changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 5000, nullable: true }
                price:
                  oneOf:
                    - type: number
                    - type: string
                stock: { type: integer, minimum: 0 }
                categoryId: { type: integer, minimum: 1 }
                imageUrl: { type: string, format: uri, nullable: true }
                isActive: { type: boolean }
            example:
              price: 199.99
              stock: 40
      responses:
        '200':
          description: The updated product (admin view, includes isActive)
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/AdminProduct' }
        '400': { $ref: '#/components/responses/ProductBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Products]
      summary: Delete a product (admin, soft delete)
      operationId: deleteProduct
      description: >
        Hides the product (isActive = false) instead of erasing it, because past orders
        still reference it. Restore it with PATCH { "isActive": true }.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product hidden (no response body)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/stats:
    get:
      tags: [Admin]
      summary: Store statistics (admin)
      operationId: getAdminStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Counts of users, products and orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer, example: 21 }
                  products: { type: integer, example: 1000 }
                  orders: { type: integer, example: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Admin]
      summary: Get any user by id (admin)
      operationId: getUserById
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user (never includes the password hash)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with this id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: User not found }

  /api/v1/cart:
    get:
      tags: [Cart]
      summary: View my cart
      operationId: getCart
      description: >
        Prices, stock and availability are looked up live. Items with a problem
        (unavailable, out of stock, not enough stock) are flagged with an issue,
        excluded from the subtotal, and block checkout until fixed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    delete:
      tags: [Cart]
      summary: Empty my cart
      operationId: clearCart
      description: Removes every item. Clearing an empty cart also succeeds.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The (now empty) cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Add a product to my cart
      operationId: addCartItem
      description: >
        Adds to the existing quantity if the product is already in the cart
        (2 in the cart + add 3 = 5). The total may not exceed the current stock or 99.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: integer, minimum: 1, example: 1 }
                quantity: { type: integer, minimum: 1, maximum: 99, default: 1, example: 2 }
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400':
          description: Invalid input, or the total would exceed 99
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Validation failed
                  value:
                    error: Validation failed
                    details:
                      - field: body.quantity
                        message: Too small, expected number to be >=1
                max:
                  summary: More than 99 of one product
                  value: { error: You can have at most 99 of a product in your cart }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not enough stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Only 40 left in stock }

  /api/v1/cart/items/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: ID of a product in the cart
        schema: { type: integer, minimum: 1, example: 1 }

    patch:
      tags: [Cart]
      summary: Set the quantity of a cart item
      operationId: setCartItemQuantity
      description: >
        Sets the quantity to exactly this number (it does not add).
        To remove an item, use DELETE instead of quantity 0.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99, example: 3 }
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The product is not in your cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This product is not in your cart }
        '409':
          description: Not enough stock, or the product is no longer available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                stock:
                  summary: Not enough stock
                  value: { error: Only 40 left in stock }
                unavailable:
                  summary: Product deactivated
                  value: { error: This product is no longer available. Remove it from your cart. }

    delete:
      tags: [Cart]
      summary: Remove an item from my cart
      operationId: removeCartItem
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The product is not in your cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This product is not in your cart }

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Check out (turn my cart into an order)
      operationId: checkout
      description: >
        Runs in one transaction: locks the cart's products (sorted by id), re-checks
        availability and stock, decrements stock, creates the order with price and address
        snapshots, and empties the cart. The total is always calculated by the server.
        If anything fails, nothing changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping]
              properties:
                shipping: { $ref: '#/components/schemas/ShippingAddress' }
      responses:
        '201':
          description: Order created (status pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '400':
          description: Invalid address, or the cart is empty
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Missing address fields
                  value:
                    error: Validation failed
                    details:
                      - field: body.shipping.city
                        message: City is required
                empty:
                  summary: Empty cart
                  value: { error: Your cart is empty }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Some items can't be ordered (nothing was changed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutConflict' }

    get:
      tags: [Orders]
      summary: List my orders (newest first)
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Orders per page (maximum 50)
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: One page of order summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Orders]
      summary: Get one of my orders
      operationId: getOrder
      description: Other users' orders return 404, so their existence is never revealed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The order, with items and shipping address
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such order for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Order not found }

  /api/v1/orders/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Orders]
      summary: Pay for a pending order (mock payment)
      operationId: payOrder
      description: >
        Test cards: any 16 digits succeed; ending in 0002 is declined; ending in 9995 has
        insufficient funds. The order row is locked during payment, so a double-click can
        never charge twice. Failed attempts are recorded. Only the last 4 digits are stored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardNumber]
              properties:
                cardNumber: { type: string, example: 4242 4242 4242 4242, description: 16 digits (spaces allowed) }
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: The payment was declined (the attempt is recorded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Payment failed: Card declined' }
        '404':
          description: No such order for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Order not found }
        '409': { $ref: '#/components/responses/TransitionConflict' }

  /api/v1/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags: [Orders]
      summary: Cancel a pending or paid order
      operationId: cancelOrder
      description: >
        In one transaction: refunds paid orders, puts every item's quantity back into stock
        (locking products in id order), and sets the status to cancelled.
        Shipped and delivered orders cannot be cancelled.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such order for this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Order not found }
        '409': { $ref: '#/components/responses/TransitionConflict' }
        '502':
          description: The payment provider failed to refund (nothing was changed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Refund failed, please try again' }

  /api/v1/admin/orders:
    get:
      tags: [Admin]
      summary: List every customer's orders (admin)
      operationId: listAllOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          description: Only orders with this status, for example paid (waiting to ship)
          schema: { type: string, enum: [pending, paid, shipped, delivered, cancelled] }
      responses:
        '200':
          description: One page of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/AdminOrderSummary' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Admin]
      summary: Ship or deliver an order (admin)
      operationId: setOrderStatus
      description: >
        Allowed moves: paid to shipped, shipped to delivered. Paying and cancelling
        have their own endpoints because they move money and stock.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [shipped, delivered], example: shipped }
      responses:
        '200':
          description: The updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Order not found }
        '409': { $ref: '#/components/responses/TransitionConflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login (valid for 15 minutes)

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Numeric ID
      schema:
        type: integer
        minimum: 1
        example: 42

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Product not found }

    ValidationError:
      type: object
      properties:
        error: { type: string, example: Validation failed }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: body.price }
              message: { type: string, example: Price must be a positive amount with at most 2 decimals }

    Category:
      type: object
      properties:
        id: { type: string, example: '4' }
        name: { type: string, example: Home & Kitchen }
        slug: { type: string, example: home-kitchen }

    Product:
      type: object
      properties:
        id:
          type: string
          example: '42'
          description: Returned as a string (64-bit integer in the database)
        name: { type: string, example: Ergonomic Office Chair }
        slug: { type: string, example: ergonomic-office-chair }
        description: { type: string, nullable: true, example: Adjustable lumbar support }
        price:
          type: string
          example: '249.99'
          description: Exact decimal as a string, to avoid floating-point rounding
        stock: { type: integer, example: 25 }
        imageUrl: { type: string, format: uri, nullable: true, example: 'https://picsum.photos/seed/product-42/640/480' }
        category: { $ref: '#/components/schemas/Category' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            isActive: { type: boolean, example: true }

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 1000 }
        totalPages: { type: integer, example: 50 }

    User:
      type: object
      properties:
        id: { type: string, example: '2' }
        email: { type: string, format: email, example: customer1@example.com }
        name: { type: string, example: Jane Perera }
        role: { type: string, enum: [customer, admin], example: customer }

    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        refreshToken: { type: string, example: 3a482afe042b6f79...e183e6f8df2f1f53 }

    CartItem:
      type: object
      properties:
        product:
          type: object
          properties:
            id: { type: string, example: '1' }
            name: { type: string, example: Handmade Ceramic Bike }
            slug: { type: string, example: handmade-ceramic-bike-1 }
            price: { type: string, example: '199.99', description: Current price (live) }
            stock: { type: integer, example: 40 }
            imageUrl: { type: string, format: uri, nullable: true }
        quantity: { type: integer, example: 3 }
        lineTotal: { type: string, example: '599.97', description: 'Price x quantity, exact' }
        issue:
          type: string
          nullable: true
          enum: [unavailable, out_of_stock, insufficient_stock]
          description: null when the item can be bought
        addedAt: { type: string, format: date-time }

    Cart:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        summary:
          type: object
          properties:
            itemCount: { type: integer, example: 3, description: Units that can be bought }
            subtotal: { type: string, example: '599.97', description: Sum of items without issues }
            canCheckout: { type: boolean, example: true }

    CartResponse:
      type: object
      properties:
        cart: { $ref: '#/components/schemas/Cart' }

    ShippingAddress:
      type: object
      required: [name, line1, city, postalCode, country]
      properties:
        name: { type: string, maxLength: 100, example: Jane Perera }
        line1: { type: string, maxLength: 200, example: 12 Temple Road }
        line2: { type: string, maxLength: 200, nullable: true, example: Apartment 4B }
        city: { type: string, maxLength: 100, example: Kandy }
        postalCode: { type: string, maxLength: 20, example: '20000' }
        country: { type: string, maxLength: 100, example: Sri Lanka }

    OrderItem:
      type: object
      properties:
        productId: { type: string, example: '1' }
        productName: { type: string, example: Handmade Ceramic Bike, description: Snapshot at checkout }
        unitPrice: { type: string, example: '199.99', description: 'Price paid (snapshot, never changes)' }
        quantity: { type: integer, example: 2 }
        lineTotal: { type: string, example: '399.98' }

    Order:
      type: object
      properties:
        id: { type: string, example: '12' }
        status: { type: string, enum: [pending, paid, shipped, delivered, cancelled], example: pending }
        totalAmount: { type: string, example: '429.98' }
        shipping: { $ref: '#/components/schemas/ShippingAddress' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        paidAt: { type: string, format: date-time, nullable: true }
        shippedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderSummary:
      type: object
      properties:
        id: { type: string, example: '12' }
        status: { type: string, enum: [pending, paid, shipped, delivered, cancelled], example: pending }
        totalAmount: { type: string, example: '429.98' }
        itemCount: { type: integer, example: 5, description: Total units in the order }
        createdAt: { type: string, format: date-time }

    CheckoutConflict:
      type: object
      properties:
        error: { type: string, example: "Some items in your cart can't be ordered" }
        details:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, example: '1' }
              name: { type: string, example: Handmade Ceramic Bike }
              issue: { type: string, enum: [unavailable, out_of_stock, insufficient_stock] }
              requested: { type: integer, example: 5 }
              available: { type: integer, example: 2 }

    AdminOrderSummary:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            customerEmail: { type: string, format: email, example: customer1@example.com }
            paidAt: { type: string, format: date-time, nullable: true }

    OrderResponse:
      type: object
      properties:
        order: { $ref: '#/components/schemas/Order' }

  responses:
    TransitionConflict:
      description: The order's current status doesn't allow this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Cannot cancel an order that is shipped }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Authentication required }
    Forbidden:
      description: Logged in, but not allowed (admin only)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: You do not have permission to do this }
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Product not found }
    ProductBadRequest:
      description: Invalid input, or the category does not exist
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Validation failed
              value:
                error: Validation failed
                details:
                  - field: body.price
                    message: Price must be a positive amount with at most 2 decimals
            category:
              summary: Unknown category
              value: { error: Category does not exist }
